name: Build Windows EXE

# Qachon ishga tushadi: main'ga push, qo'lda (workflow_dispatch), yoki teg (v*)
on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content core/version.py) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content core/version.py
          Write-Host "version.py -> $v"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm pos.spec

      - name: Zip the build
        run: Compress-Archive -Path dist/POSAwesome/* -DestinationPath POSAwesome-windows.zip

      - name: Upload artifact (har build'da yuklanadi)
        uses: actions/upload-artifact@v4
        with:
          name: POSAwesome-windows
          path: POSAwesome-windows.zip
          retention-days: 30

      - name: Create Release (faqat v* teg bo'lsa)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: POSAwesome-windows.zip
